<!DOCTYPE html>
<!-- Live Abfahrten International v2.0 b1 -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departures</title>
  <link rel="stylesheet" href="style.css">
<!-- Apple iOS Home Screen Icon -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Android / PWA icons -->

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="manifest" href="manifest.json">

  <!-- iOS PWA fullscreen / dark background -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <script data-goatcounter="https://tnuh.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<div class="title-block">
  <button id="menu-btn" aria-label="Menu">&#9776;</button>
  <div class="title-text-group">
    <div class="title-inner">
      <div class="title-row">
        <div id="title-text"></div>
        <span id="title-flag" class="title-flag">🇨🇭</span>
      </div>
      <div id="subtitle-text"></div>
      <div class="title-line"></div>
    </div>
  </div>
</div>

  <!-- ICON TOOLBAR (Zurück / Umgebung / Suche) -->
  <div class="icon-toolbar-wrap">
    <button id="back-to-favs" class="back-link is-hidden" type="button">
      <span class="back-chevron">‹</span> <span id="back-label">Favoriten</span>
    </button>
    <div class="icon-toolbar">
      <button id="btn-near" class="icon-btn" type="button" aria-label="Nearby">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
      <button id="btn-search" class="icon-btn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>
  </div>

  <!-- FAVOURITES / WELCOME SCREEN -->
  <div id="favourites-view">
    <div id="welcome-view" class="welcome-view" hidden>
      <svg class="welcome-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="4" width="12" height="12" rx="2" ry="2"></rect>
        <line x1="6" y1="4" x2="18" y2="4"></line>
        <line x1="10" y1="2" x2="14" y2="2"></line>
        <line x1="10" y1="20" x2="8" y2="22"></line>
        <line x1="14" y1="20" x2="16" y2="22"></line>
        <circle cx="9" cy="14" r="1"></circle>
        <circle cx="15" cy="14" r="1"></circle>
      </svg>
      <div id="welcome-title" class="welcome-title"></div>
      <p id="welcome-desc" class="welcome-desc"></p>
      <div class="welcome-divider"></div>
      <div class="welcome-features">
        <div class="welcome-feature"><span class="welcome-feature-icon">🇨🇭🇩🇪</span><span id="welcome-feature-countries"></span></div>
        <div class="welcome-feature"><span class="welcome-feature-icon">🔍</span><span id="welcome-feature-search"></span></div>
        <div class="welcome-feature"><span class="welcome-feature-icon">▸</span><span id="welcome-feature-board"></span></div>
      </div>
      <div class="welcome-divider"></div>
      <div class="welcome-buttons">
        <button id="welcome-search-btn" class="welcome-btn" type="button"></button>
        <button id="welcome-nearby-btn" class="welcome-btn" type="button"></button>
      </div>
      <div class="welcome-divider"></div>
      <p id="welcome-hint" class="welcome-hint"></p>
    </div>
    <div id="fav-list" class="fav-list"></div>
  </div>

  <!-- BOARD VIEW (Abfahrtstafel) -->
  <div id="board-view" hidden>
    <!-- CURRENT STATION -->
    <div class="station-area">
      <div id="currentStationWrap">
        <div id="currentStation" class="display-chip">
          <span id="currentStationLabel">Zürich HB</span>
        </div>
      </div>
    </div>

    <!-- DEPARTURES TABLE -->
    <table id="departures" class="departure-table">
      <thead>
        <tr>
          <th id="th-line">Line</th>
          <th id="th-station"><span id="th-station-label">Station</span></th>
          <th id="th-time">
            <button id="toggle-time" class="chip small">Departure</button>
          </th>
        </tr>
        <tr id="refresh-bar-row">
          <td colspan="3"><div id="refresh-bar"></div></td>
        </tr>
      </thead>
   <tbody></tbody>
  <tr id="status-row" style="display:none;">
    <td colspan="3" id="status-msg"></td>
  </tr>
    </table>
  </div>

  <div id="footer-info">
    <span>© 2026 Martin · Live Departures v2.0 b1</span>
    <span id="datasource-note" style="display:none;"></span>
  </div>

  <!-- NEARBY BACKDROP / SHEET -->
  <div id="nearby-backdrop"></div>
  <div id="nearby-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title-row">
      <span id="nearby-title-label">In der Nähe</span>
      <button id="nearby-close-btn" type="button">Schliessen</button>
    </div>
    <div class="sheet-divider"></div>
    <div id="nearby-list" class="fav-list"></div>
  </div>

  <!-- SEARCH BACKDROP / SHEET -->
  <div id="search-backdrop"></div>
  <div id="search-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title-row">
      <span id="search-title-label">Suche</span>
      <button id="search-close-btn" type="button">Schliessen</button>
    </div>
    <div class="sheet-divider"></div>
    <div class="ac-input-wrap">
      <input id="stationSearch" class="ac-input" type="search"
             inputmode="search" autocomplete="off"
             placeholder="Type e.g. Zürich or Berlin Hbf"
             aria-autocomplete="list" aria-controls="search-results">
    </div>
    <div id="search-results" class="fav-list"></div>
  </div>

  <!-- MENU BACKDROP -->
  <div id="menu-backdrop"></div>

  <!-- BOTTOM SHEET -->
  <div id="menu-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-item sheet-version">Live Departures v2.0 b1</div>
    <div class="sheet-divider"></div>
    <button class="sheet-item sheet-btn" id="sheet-lang">
      <span id="sheet-lang-label">Sprache</span>
      <span id="sheet-lang-value"><b>DE</b> / EN</span>
    </button>
    <div class="sheet-divider"></div>
    <button class="sheet-item sheet-btn" id="sheet-about">
      <span id="sheet-about-label">Über die App</span>
      <span class="sheet-chevron">▾</span>
    </button>
    <div class="sheet-divider"></div>
    <div class="sheet-item sheet-land">
      <span id="sheet-land-label">Land</span>
      <span class="land-flags">
        <button class="land-flag-btn" type="button" data-country="CH" aria-label="Schweiz">🇨🇭</button>
        <button class="land-flag-btn" type="button" data-country="DE" aria-label="Deutschland">🇩🇪</button>
      </span>
    </div>
    <div class="sheet-divider"></div>
    <div class="sheet-item sheet-accent">
      <span id="sheet-accent-label">Akzentfarbe</span>
      <span class="accent-swatches">
        <button class="accent-swatch" type="button" data-accent="orange" aria-label="Orange"></button>
        <button class="accent-swatch" type="button" data-accent="white" aria-label="Weiss"></button>
      </span>
    </div>
    <div class="sheet-divider"></div>
    <a class="sheet-item sheet-link" id="sheet-feedback" href="#">Feedback</a>
    <div class="sheet-divider"></div>
    <button class="sheet-item sheet-btn" id="sheet-support">
      <span id="sheet-support-label">Trinkgeld für den Entwickler</span>
      <span class="sheet-chevron">▾</span>
    </button>
    <div class="sheet-support-btns" id="support-content" hidden>
      <a class="support-btn" target="_blank" rel="noopener"
         data-chf="https://buy.stripe.com/cNibJ01W4gyq1wges3d7q05" data-chf-label="CHF 1"
         data-eur="https://buy.stripe.com/7sY14mfMU0zs4Is6ZBd7q06" data-eur-label="EUR 1">CHF 1</a>
      <a class="support-btn" target="_blank" rel="noopener"
         data-chf="https://buy.stripe.com/4gMcN4308gyq8YI1Fhd7q00" data-chf-label="CHF 2"
         data-eur="https://buy.stripe.com/3cI8wO8ks5TMgra3Npd7q07" data-eur-label="EUR 2">CHF 2</a>
      <a class="support-btn" target="_blank" rel="noopener"
         data-chf="https://buy.stripe.com/8x2cN4dEMdme3Eo83Fd7q01" data-chf-label="CHF 5"
         data-eur="https://buy.stripe.com/cNieVc44cfum6QAdnZd7q08" data-eur-label="EUR 5">CHF 5</a>
    </div>
    <div class="sheet-divider"></div>
    <div id="about-content" hidden>
      <p id="about-text"></p>
      <a id="about-more" href="about.html"></a>
    </div>
  </div>

  <!-- STOPS BACKDROP -->
  <div id="stops-backdrop"></div>

  <!-- STOPS (ZWISCHENSTATIONEN) SHEET -->
  <div id="stops-sheet">
    <div class="sheet-handle"></div>
    <div id="stops-title-row">
      <span id="stops-title-label">Halte</span>
      <button id="stops-close-btn" type="button">Schliessen</button>
    </div>
    <div class="sheet-divider"></div>
    <div id="stops-info">
      <div id="stops-info-top">
        <span id="stops-info-line"></span>
        <span id="stops-info-time"></span>
      </div>
      <div id="stops-info-bottom">
        <span id="stops-info-dest"></span>
        <span id="stops-info-arrival"></span>
      </div>
    </div>
    <div class="sheet-divider"></div>
    <div id="stops-list"></div>
  </div>

  <script src="main.js"></script>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const VERSION = "v2.0 b1";

    // Feedback mailto
    document.getElementById("sheet-feedback").href =
      `mailto:welcome@live-departures.app?subject=Live%20Departures%20Feedback%20${encodeURIComponent(VERSION)}`;

    // Elements
    const menuBtn      = document.getElementById("menu-btn");
    const sheet        = document.getElementById("menu-sheet");
    const backdrop     = document.getElementById("menu-backdrop");
    const aboutBtn     = document.getElementById("sheet-about");
    const aboutLabel   = document.getElementById("sheet-about-label");
    const aboutContent = document.getElementById("about-content");
    const aboutText    = document.getElementById("about-text");
    const aboutMore    = document.getElementById("about-more");

    function openMenu() {
      const lang = localStorage.getItem("lang") || "de";
      const country = localStorage.getItem("preferredCountry") || "CH";
      const cur = country === "DE" ? "eur" : "chf";
      document.querySelectorAll(".support-btn").forEach(btn => {
        btn.href = btn.dataset[cur];
        btn.textContent = btn.dataset[cur + "Label"];
      });
      aboutLabel.textContent = lang === "en" ? "About" : "Über die App";
      document.getElementById("sheet-support-label").textContent =
        lang === "en" ? "Tip the developer" : "Trinkgeld für den Entwickler";
      document.getElementById("sheet-lang-label").textContent =
        lang === "en" ? "Language" : "Sprache";
      document.getElementById("sheet-lang-value").innerHTML =
        lang === "en" ? "DE / <b>EN</b>" : "<b>DE</b> / EN";
      sheet.classList.add("open");
      backdrop.classList.add("open");
    }

    function closeMenu() {
      sheet.classList.remove("open");
      backdrop.classList.remove("open");
      aboutContent.hidden = true;
      aboutBtn.classList.remove("active");
      supportContent.hidden = true;
      supportBtn.classList.remove("active");
    }

    window.closeMenu = closeMenu;
    menuBtn.addEventListener("click", openMenu);
    backdrop.addEventListener("click", closeMenu);

    // Support toggle
    const supportBtn     = document.getElementById("sheet-support");
    const supportContent = document.getElementById("support-content");

    supportBtn.addEventListener("click", () => {
      const isOpen = !supportContent.hidden;
      supportContent.hidden = isOpen;
      supportBtn.classList.toggle("active", !isOpen);
    });

    // About toggle
    aboutBtn.addEventListener("click", () => {
      const isOpen = !aboutContent.hidden;
      if (!isOpen) {
        const lang = localStorage.getItem("lang") || "de";
        aboutText.textContent = lang === "en"
          ? "Real-time public transport departures for Switzerland and Germany — right in your browser, no registration, no tracking."
          : "Echtzeit-Abfahrten für den öffentlichen Verkehr in der Schweiz und Deutschland — direkt im Browser, ohne Registrierung, ohne Tracking.";
        aboutMore.textContent = lang === "en" ? "Full details →" : "Mehr erfahren →";
      }
      aboutContent.hidden = isOpen;
      aboutBtn.classList.toggle("active", !isOpen);
    });
  });
  </script>
</body>
</html>
